quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:${QUARKUS_DATASOURCE_PASSWORD:1234}}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/fluxplay}

quarkus.hibernate-orm.schema.management.strategy=${HIBERNATE_SCHEMA_STRATEGY:update}
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:true}

quarkus.http.port=${HTTP_PORT:8081}